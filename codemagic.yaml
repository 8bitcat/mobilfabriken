# Mobilfabriken som iOS-app: Codemagic bygger app/ (Capacitor) på en Mac i molnet och skickar bygget till
# TestFlight – samma upplägg som Pixelcity (8bitcat/snabbfilen) och Pixelskolan. Spelet är detsamma som på
# webben: app/build.mjs kopierar spelet till app/www och lägger three.js lokalt.
#   Starta: Codemagic → mobilfabriken → Start new build → iOS → TestFlight
#           eller node app/tools/codemagic.mjs start <appId> ios-testflight main   (se Snabbfilens app/tools)
#   Signering: App Store-profilen "Mobilfabriken App Store" (skapad via App Store Connect API 2026-11-23)
#   hämtas i Codemagic: Teams → Personal account → Code signing identities → iOS provisioning profiles →
#   Fetch profiles. Samma Apple Distribution-certifikat som Pixelcity.
#   Före första bygget: APP_STORE_APPLE_ID nedan (App Store Connect → appen → App Information → Apple ID).
workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 45
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic        # API-nyckelns namn i Codemagic (Integrations → Developer Portal)
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: io.eightbitcat.mobilfabriken
      vars:
        APP_STORE_APPLE_ID: 0             # FYLL I: Mobilfabriken i App Store Connect (App Information → Apple ID)
        XCODE_PROJECT: App.xcodeproj
        XCODE_SCHEME: App
      node: 22
      xcode: latest
    scripts:
      - name: Installera
        script: cd app && npm ci
      - name: Spelet in i appen
        script: cd app && node build.mjs && npx cap sync ios
      - name: Signering
        script: xcode-project use-profiles
      - name: Version och byggnummer
        script: |
          # appens version i App Store = app/package.json appVersion (t.ex. 1.0); byggnumret = senaste TestFlight-bygge + 1
          VERSION=$(node -p "require('./app/package.json').appVersion")
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          BUILD=$((LATEST + 1))
          echo "Mobilfabriken $VERSION (bygge $BUILD)"
          sed -i '' -E "s/MARKETING_VERSION = [^;]+;/MARKETING_VERSION = $VERSION;/; s/CURRENT_PROJECT_VERSION = [^;]+;/CURRENT_PROJECT_VERSION = $BUILD;/" app/ios/App/App.xcodeproj/project.pbxproj
      - name: Bygg ipa
        script: |
          cd app/ios/App
          # går arkiveringen fel skrivs Xcodes egna felrader ut här (annars syns bara "Failed to archive")
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME" || {
            echo "--- felen från xcodebuild ---"
            grep -h -E "error:|Provisioning profile|doesn't (include|support|match)" /tmp/xcodebuild_logs/*.log | sort -u | head -40
            exit 1
          }
    artifacts:
      - app/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # bara uppladdning: interna testare (Carl) får bygget direkt i TestFlight
        submit_to_testflight: false
        submit_to_app_store: false
