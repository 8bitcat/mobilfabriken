<!doctype html>
<meta charset="utf-8">
<style>
  body { margin: 0; background: #0b0e1c; color: #f1ebe0; font: 12px monospace; display: flex; flex-wrap: wrap; gap: 10px; padding: 10px; width: 1560px; }
  figure { margin: 0; } canvas { display: block; image-rendering: pixelated; } figcaption { padding: 2px 0; color: #ffd23f; }
</style>
<script type="module">
  import { GLIMTAR, glimtBild } from '../../js/konsol/glimtar.js';
  const q = new URLSearchParams(location.search), bara = q.get('bara'), tider = (q.get('t') || '1,3.3').split(',').map(Number), k = +(q.get('k') || 3);
  for (const g of GLIMTAR) for (const t of tider) {
    if (bara && !bara.split(',').includes(g.id)) continue;
    const f = document.createElement('figure'), c = document.createElement('canvas'), cap = document.createElement('figcaption');
    c.width = g.w * k; c.height = g.h * k; const x = c.getContext('2d'); x.imageSmoothingEnabled = false;
    x.drawImage(glimtBild(g.id, t), 0, 0, g.w * k, g.h * k);
    cap.textContent = `${g.titel} (${g.forebild}) ${g.ar} · t=${t}`; f.append(c, cap); document.body.append(f);
  }
  window.__klar = true;
</script>
