<!doctype html>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #0b0e1c; color: #f1ebe0; font: 13px monospace; }
  body { display: grid; grid-template-columns: repeat(3, 420px); gap: 8px; padding: 8px; }
  canvas { width: 420px; height: 300px; display: block; } div { position: relative; } b { position: absolute; left: 8px; top: 6px; color: #ffd23f; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script type="module">
  // ?vinkel=0.6&pitch=0.3&oppning=1&kropp=3a7bd5&yta=matt
  import { skapaTelefonGL } from '../../js/telefon/telefon-gl.js';
  import { KONSOLFORMER } from '../../js/konsol/konsol-gl.js';
  const q = new URLSearchParams(location.search);
  const yaw = +(q.get('vinkel') || 0.55), pitch = +(q.get('pitch') || 0.32), oppning = q.has('oppning') ? +q.get('oppning') : undefined;
  const kropp = q.get('kropp') ? '#' + q.get('kropp') : undefined, yta = q.get('yta') || 'klassisk', bara = q.get('bara');
  for (const f of KONSOLFORMER) {
    if (bara && !bara.split(',').includes(f.id.replace('konsol-', ''))) continue;
    const d = document.createElement('div'), c = document.createElement('canvas'), b = document.createElement('b');
    b.textContent = `${f.namn} ${f.ar}`; d.append(c, b); document.body.append(d);
    const tel = { enhet: f.id, kropp, yta, bredd: 1, hojd: 1, djup: 0.3 };
    const s = skapaTelefonGL(c, { tel, vy: 'manuell', yaw, pitch });
    s.tel = tel; s.vy = 'manuell'; s.yaw = yaw; s.pitch = pitch; s.oppning = oppning; s.rita(); s.rita();
  }
  window.__klar = true;
</script>
